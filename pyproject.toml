[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yield-audit"
version = "0.3.2"
description = "Outcome accounting for AI coding agents: measure what survived, what it cost, and what was wasted — fully local."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "yield-audit contributors" }]
keywords = ["ai", "agents", "tokens", "cost", "observability", "claude", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
# Runtime dependencies: none. git must be installed and on PATH.

[project.urls]
Homepage = "https://github.com/ictechgy/yield-audit"
Changelog = "https://github.com/ictechgy/yield-audit/blob/main/CHANGELOG.md"

[project.scripts]
yield-audit = "yield_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/yield_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
